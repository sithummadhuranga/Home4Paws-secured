name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend CI
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run linting
      #   run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests (if available)
        run: npm test --if-present

  # Backend CI
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Home4Paws.sln

      - name: Build solution
        run: dotnet build Home4Paws.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Home4Paws.sln --no-build --configuration Release --verbosity normal

  # Secret scan (V01): fails if a password, key or token is committed
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Fails if any secret is present in the files as they are now
      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner -v

      # Fails if a pull request adds a secret in any of its commits, even one a later
      # commit removes again. Older history is not rescanned: the secrets leaked before
      # the V01 fix are rotated and documented in the report as not fixable.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --no-banner -v \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # Optional: Only run if both frontend and backend pass
  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed - ready for deployment!"
